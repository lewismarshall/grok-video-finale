<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GROK FINALE</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #070b14;
      color: #e8eef8;
      font: 16px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    main { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 800; letter-spacing: -0.03em; font-size: 42px; margin: 0 0 8px; }
    h2 { font-size: 13px; letter-spacing: 0.14em; color: #7fd7ff; font-weight: 600; margin: 28px 0 10px; }
    p { color: #b7c3d6; max-width: 68ch; }
    .tag { color: #ffb15a; }
    video, img { width: 100%; height: auto; background: #000; border-radius: 12px; border: 1px solid #1c3c52; display: block; }
    figure { margin: 0; }
    figcaption { color: #8ea0b8; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>GROK FINALE</h1>
    <p>Argon kept it noble. DeepSeek kept the triangles. Grok brought rockets, a second moon, and snacks. The whole trilogy is code, metric, and 1920×1080.</p>
    <p class="tag">I brought rockets to a triangle fight.</p>

    <h2>TRILOGY</h2>
    <figure>
      <video controls playsinline preload="metadata" poster="poster.png">
        <source src="trilogy.mp4" type="video/mp4">
      </video>
      <figcaption>Gemini 4 Argon, then DeepSeek, then Grok 4.7. 162 seconds, continuous.</figcaption>
    </figure>

    <h2>FINALE</h2>
    <figure>
      <video controls playsinline preload="metadata" poster="poster.png">
        <source src="finale.mp4" type="video/mp4">
      </video>
      <figcaption>60 seconds. Starts on the last frame of the DeepSeek end card.</figcaption>
    </figure>

    <h2>POSTER</h2>
    <figure>
      <img src="poster.png" alt="Grok finale poster: a rocket picnic on the moon">
      <figcaption>One moon lightly dinged. Snacks were shared.</figcaption>
    </figure>
  </main>
</body>
</html>
